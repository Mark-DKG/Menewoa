name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Uses `npm ci` when a lockfile is committed (recommended), `npm install` otherwise.
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm test
      - run: npm run test:components
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://zeoqtdynnzqnhbcgpenb.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - run: npm audit --omit=dev --audit-level=high

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: npm run test:db
      - run: npm run test:backup
