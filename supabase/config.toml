# Settings for LOCAL development (`supabase start`). For your hosted project, apply the same
# choices in the dashboard (Authentication -> Providers / Policies / Rate limits) — see
# docs/DEPLOYMENT.md. Keep these in step with the hosted project.
project_id = "menewoa"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/login", "http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true          # email must be verified before first sign-in
secure_password_change = true
max_frequency = "60s"                # per-address limit on verification/reset emails
otp_length = 6
otp_expiry = 3600

[auth.rate_limit]
email_sent = 4                       # per hour (local default; raise only with custom SMTP)
sign_in_sign_ups = 30                # per 5 minutes per IP
token_verifications = 30
token_refresh = 150

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sessions]
# timebox = "720h"                   # uncomment (Pro plan) to cap absolute session age
# inactivity_timeout = "168h"

[functions.delete-account]
verify_jwt = true
[functions.admin-delete-user]
verify_jwt = true
[functions.send-notifications]
verify_jwt = false                   # authenticated by the x-cron-secret header instead
